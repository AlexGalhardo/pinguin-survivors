      <feFlood flood-color="#000000" flood-opacity="1"/>
      <feComposite in2="fx1_is_inv" operator="in" result="fx1_is_shadow"/>
      <feComposite in="fx1_is_shadow" in2="SourceGraphic" operator="over"/>
