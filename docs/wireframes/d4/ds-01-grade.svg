    <g transform="translate(48, 268)">
      <text x="0" y="24" font-family="Roboto" font-size="24" fill="#E8ECF2">Uso: padding interno de painel/tooltip/item = space-3 a space-4 (12–16; máx. space-5 = 20). Gap entre itens de lista = 0 (a altura do item já dá o ritmo). Gap entre grupos = space-3 (12). Gap entre blocos de tela = space-6 a space-10.</text>
