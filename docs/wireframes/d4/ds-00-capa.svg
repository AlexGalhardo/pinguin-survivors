    <g transform="translate(48, 178)">
      <text x="0" y="26" font-family="Roboto" font-size="26" fill="#E8ECF2">Fonte única da verdade para as telas do Estilo D (Diablo IV). Toda tela usa só estes tokens e componentes. Valores em px na base 1920×1080; o jogo escala pela altura (fator = altura / 1080, mínimo 0,667 em 1280×720).</text>
    </g>
    <g transform="translate(48, 256)">
      <text x="0" y="26" font-family="Roboto" font-size="26" font-weight="700" fill="#E0BB62">Regra 1 — Legibilidade: secundário ≥ 22 px (≈ 18 px em 844×390), lista ≥ 30 px, contraste AA. Regra 2 — Padding interno 12–16 px (máx. 20), caixa ajustada ao conteúdo; o respiro vem do fundo e da vinheta.</text>
    </g>
    <g transform="translate(48, 334)">
      <text x="0" y="22" font-family="Roboto" font-size="22" fill="#E8ECF2">Seções: 1 Grade · 2 Cores · 3 Tipografia · 4 Elevação · 5 Bordas e ornamentos · 6 Componentes · 7 Ícones · 8 Layout · 9 React/Tailwind.</text>
    </g>
