    </filter>
    <filter id="fx2">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4FD06A" flood-opacity="1"/>
    </filter>
  </defs>
  <g transform="translate(12, 0)">
    <rect width="1920" height="900" fill="#0B0E14"/>
    <g transform="translate(48, 48)">
      <g>
        <text x="0" y="26" font-family="Roboto" font-size="26" font-weight="900" fill="#E0BB62" letter-spacing="3">DSECTION (painel sem caixa)</text>
      </g>
      <g transform="translate(0, 48)">
        <g>
          <text x="0" y="24" font-family="Roboto" font-size="24" font-weight="900" fill="#E0BB62" letter-spacing="4">ATRIBUTOS BASE</text>
        </g>
        <g transform="translate(0, 37)">
          <rect width="560" height="1" fill="#A8843A"/>
        </g>
        <g transform="translate(0, 46)">
          <text x="0" y="24" font-family="Roboto" font-size="24" fill="#E8ECF2">Conteúdo direto sobre o fundo; agrupado por luz (brilho) e espaço.</text>
        </g>
      </g>
      <g transform="translate(0, 168)">
        <text x="0" y="22" font-family="Roboto" font-size="22" fill="#E8ECF2">Quando precisa de superfície (carta, tooltip, encaixe): panel-top + elev-0 inset, padding 12–16, sem borda sólida.</text>
      </g>
      <g transform="translate(0, 238)">
