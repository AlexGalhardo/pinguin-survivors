        <text x="0" y="22" font-family="Roboto" font-size="22" font-weight="700" fill="#E0BB62" letter-spacing="2">ENTER  CONFIRMAR      ESC  VOLTAR      L1/R1  ABA</text>
      </g>
      <g transform="translate(0, 400)">
        <text x="0" y="22" font-family="Roboto" font-size="22" fill="#E8ECF2">Troca conforme a entrada (teclado: ENTER/ESC; gamepad: ícones A/B 32 px; toque: some, e as ações viram itens tocáveis de 44+). Cada dica no rodapé é também um alvo de toque de 44 px.</text>
      </g>
      <g transform="translate(0, 497)">
        <text x="0" y="26" font-family="Roboto" font-size="26" font-weight="900" fill="#E0BB62" letter-spacing="3">ESTADO VAZIO</text>
      </g>
      <g transform="translate(0, 545)">
        <text x="0" y="24" font-family="Roboto" font-size="24" fill="#E8ECF2">Frase centralizada 24 + sprite 96 apagado: “Nenhuma partida ainda. Vá matar uns zumbis!”</text>
      </g>
