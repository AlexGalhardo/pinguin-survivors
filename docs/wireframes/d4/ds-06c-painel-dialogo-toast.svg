        <g>
          <text x="0" y="28" font-family="Roboto" font-size="28" font-weight="900" fill="#FF9A3C" letter-spacing="2">🐟 120 PEIXES</text>
        </g>
        <g transform="translate(201, 0)">
          <text x="0" y="28" font-family="Roboto" font-size="28" font-weight="900" fill="#6FA3C7" letter-spacing="2">12 PÉROLAS</text>
        </g>
        <g transform="translate(416, 0)">
          <text x="0" y="28" font-family="Roboto" font-size="28" font-weight="900" fill="#E0BB62" letter-spacing="2">3 PONTOS</text>
        </g>
      </g>
      <g transform="translate(0, 266)">
        <text x="0" y="22" font-family="Roboto" font-size="22" fill="#E8ECF2">Ícone pixel art 24/32 + número 28 900 tabular; preço insuficiente = blood bold.</text>
      </g>
      <g transform="translate(0, 309)">
        <text x="0" y="26" font-family="Roboto" font-size="26" font-weight="900" fill="#E0BB62" letter-spacing="3">DKEYHINT</text>
      </g>
