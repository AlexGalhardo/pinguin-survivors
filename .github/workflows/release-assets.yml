name: Release assets

# Attaches the downloadable builds to a GitHub release (SDD-011 RF-07): the full and demo Windows
# builds (unpacked Electron folder, zipped) and the Android debug APK. Runs when a release is
# published, or by hand for an existing tag. Builds keep the sound on (no SOUND_MUTED here).
#
# Privilege split: the build jobs only read the repository and hand their files over as workflow
# artifacts; the `publish` job is the only one with `contents: write`, and it runs no repository code.
# `gh release upload --clobber` REPLACES an asset with the same name, so re-running for a tag that
# already has these files overwrites them.
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to build and attach assets to (e.g. v0.2.0)
                type: string
                required: true
            upload:
                description: Attach the builds to the release (false = build only, as workflow artifacts)
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
    cancel-in-progress: false

env:
    TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
    windows:
        runs-on: windows-latest
        timeout-minutes: 45
        steps:
            - name: Check the tag
              shell: bash
              run: |
                  [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $TAG"; exit 1; }
                  echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ env.TAG }}
            # Third-party action pinned to the v2.2.0 commit.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            - run: bun run build:desktop
            - run: bun run build:desktop:demo
            - name: Zip the unpacked builds
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path out | Out-Null
                  Compress-Archive -Path apps/desktop/dist/full/win-unpacked -DestinationPath "out/pinguin-survivors-$env:VERSION-windows-x64.zip"
                  Compress-Archive -Path apps/desktop/dist/demo/win-unpacked -DestinationPath "out/pinguin-survivors-demo-$env:VERSION-windows-x64.zip"
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: windows-zips
                  path: out/*.zip
                  if-no-files-found: error

    android:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Check the tag
              run: |
                  [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $TAG"; exit 1; }
                  echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ env.TAG }}
            # Third-party action pinned to the v2.2.0 commit.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-java@v6.2.0
              with:
                  distribution: temurin
                  java-version: "21"
            # The hosted runner ships the Android SDK; make sure the pieces compileSdk 36 needs are there.
            - name: Android SDK packages
              run: |
                  yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun install --frozen-lockfile
              working-directory: apps/mobile
            - run: bun run sync
              working-directory: apps/mobile
            - name: Gradle debug APK
              working-directory: apps/mobile/android
              env:
                  VERSION_NAME: ${{ env.VERSION }}
                  VERSION_CODE: ${{ github.run_number }}
              run: ./gradlew assembleDebug --no-daemon
            - name: Name the APK
              run: |
                  mkdir out
                  cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "out/pinguin-survivors-$VERSION-android-debug.apk"
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: android-apk
                  path: out/*.apk
                  if-no-files-found: error

    publish:
        needs: [windows, android]
        # Releases always upload; a manual run can set upload=false to only check the builds.
        if: github.event_name == 'release' || inputs.upload
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8.0.2
              with:
                  path: assets
                  merge-multiple: true
            - name: Upload to the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  ls -l assets
                  gh release upload "$TAG" assets/* --clobber
