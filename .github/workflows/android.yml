name: Android

# Manual only: nothing is published automatically (SDD-007 RF-06, ROADMAP T8.3). Builds the game,
# wraps it with Capacitor (apps/mobile) and uploads the AAB as a workflow artifact.
#
# Secrets for the signed release bundle (Settings > Secrets and variables > Actions); values are
# never written here or to the logs:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
# Without the keystore secret a release run still builds, but the bundle is unsigned.
on:
    workflow_dispatch:
        inputs:
            build_type:
                description: Bundle to build
                type: choice
                options:
                    - release
                    - debug
                default: release

permissions:
    contents: read

concurrency:
    group: android
    cancel-in-progress: false

jobs:
    bundle:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
            ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
            VERSION_CODE: ${{ github.run_number }}
        steps:
            - uses: actions/checkout@v7.0.1
            # Third-party action pinned to the v2.2.0 commit.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-java@v6.2.0
              with:
                  distribution: temurin
                  java-version: "21"
            # The hosted runner ships the Android SDK; make sure the pieces compileSdk 36 needs are there.
            - name: Android SDK packages
              run: |
                  yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun install --frozen-lockfile
              working-directory: apps/mobile
            - run: bun run sync
              working-directory: apps/mobile
            - name: Version name from package.json
              run: echo "VERSION_NAME=$(bun -p "require('./package.json').version")" >> "$GITHUB_ENV"
            - name: Keystore
              if: inputs.build_type == 'release' && env.ANDROID_KEYSTORE_PASSWORD != ''
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
                  echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            - name: Gradle bundle
              working-directory: apps/mobile/android
              run: ./gradlew ${{ inputs.build_type == 'debug' && 'bundleDebug' || 'bundleRelease' }} --no-daemon
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: pinguin-survivors-${{ inputs.build_type }}-aab
                  path: apps/mobile/android/app/build/outputs/bundle/${{ inputs.build_type }}/*.aab
                  if-no-files-found: error
