name: Pages

# Manual only until the developer approves publishing (ROADMAP T5.7): the wishlist link is still a
# placeholder and the repository Pages source must be set to GitHub Actions first.
on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            # Third-party action pinned to the v2.2.0 commit.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run typecheck
            - run: bun test
            - run: bun install --frozen-lockfile
              working-directory: site
            - uses: actions/configure-pages@v6.0.0
              id: pages
            # Project Pages serve under /pinguin-survivors/; the actions output carries the real origin and path.
            - run: bun scripts/build-site.ts
              env:
                  SITE_URL: https://alexgalhardo.github.io
                  SITE_BASE: /pinguin-survivors/
            - uses: actions/upload-pages-artifact@v5.0.0
              with:
                  path: site/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5.0.1
