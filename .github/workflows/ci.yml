name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest # always the latest stable Bun release
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run typecheck
            - run: bun test
            - run: bun run build
    e2e:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest # always the latest stable Bun release
            - run: bun install --frozen-lockfile
            - run: bunx playwright install --with-deps chromium
            - run: bun run e2e -- --demo
            - name: Full e2e against the dev server
              run: |
                  SOUND_MUTED=true bun run dev &
                  curl --retry 30 --retry-connrefused --retry-delay 1 -s http://localhost:5173 -o /dev/null
                  bun run e2e
